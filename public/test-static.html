<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static assets test</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/index.css">
</head>
<body style="font-family:sans-serif;padding:2rem;background:#0d1117;color:#e6edf3;">
  <h1>Static assets test</h1>
  <p>If you see this page with styles and no 401, favicon and CSS are served without auth.</p>
  <p id="status">Loading…</p>
  <script>
    (function() {
      var status = document.getElementById('status');
      Promise.all([
        fetch('/favicon.ico').then(function(r) { return r.status; }),
        fetch('/favicon.png').then(function(r) { return r.status; }),
        fetch('/index.css').then(function(r) { return r.status; })
      ]).then(function(codes) {
        var ok = codes.every(function(c) { return c === 200; });
        status.textContent = ok ? 'OK: favicon.ico=' + codes[0] + ', favicon.png=' + codes[1] + ', index.css=' + codes[2] : 'One or more failed: ' + codes.join(', ');
        status.style.color = ok ? '#138808' : '#f85149';
      }).catch(function(e) {
        status.textContent = 'Error: ' + e.message;
        status.style.color = '#f85149';
      });
    })();
  </script>
</body>
</html>
