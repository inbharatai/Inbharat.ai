         HTTP Cache-Control header and hold an old index.html across deploys.

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <!-- Self-heal for stale carrier-proxy HTML. If a mobile carrier proxy serves
         a pre-deploy index.html whose hashed app module (/assets/index-<oldhash>.js)
         no longer exists on the current Vercel deployment, the module 404s and React
         never mounts — the page shows the static shell with NO article cards. This
         listener detects that module load failure and reloads once with a
         cache-busting query (?__r=1), which changes the proxy's cache key so it
         re-fetches fresh HTML referencing the CURRENT asset hashes. The __r=1 guard
         prevents a loop if the deploy is genuinely broken. No-op when the app loads
         normally. -->
    <script>
      (function () {
        try {
          if (/[?&]__r=1\b/.test(location.search)) return; // already retried — don't loop
          var s = document.querySelector('script[type="module"][src^="/assets/"]');
          if (!s) return; // dev mode (src="/index.tsx") or already hydrated — ignore
          s.addEventListener('error', function () {
            var url = location.pathname + (location.search ? location.search + '&' : '?') + '__r=1';
            location.replace(url);
          });
        } catch (e) { /* never block the page */ }
      })();
    </script>
