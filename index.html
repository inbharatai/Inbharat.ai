
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>InBharat Ai – Desh Ka AI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            -webkit-font-smoothing: antialiased;
        }
        .prose {
            max-width: none;
            line-height: 1.75;
        }
        .prose h1, .prose h2, .prose h3 {
            color: #fff !important;
            font-weight: 800 !important;
            margin-top: 1.5em !important;
            margin-bottom: 0.5em !important;
            letter-spacing: -0.025em;
        }
        .prose p {
            margin-bottom: 1.25em !important;
            color: #d1d5db !important;
        }
        .prose ul, .prose ol {
            margin-bottom: 1.25em !important;
            padding-left: 1.5em !important;
        }
        .prose li {
            margin-bottom: 0.5em !important;
            color: #d1d5db !important;
        }
        .prose code {
            font-family: 'JetBrains Mono', monospace;
            background: #1c2128;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .prose pre {
            background: #161b22 !important;
            border: 1px solid #30363d;
            padding: 1.5em !important;
            border-radius: 12px !important;
            margin: 1.5em 0 !important;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(48, 54, 61, 0.5);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media (max-width: 1023px) {
            html { -webkit-text-size-adjust: 100%; }
        }
        .touch-manual { touch-action: manipulation; }
        @supports (padding: env(safe-area-inset-bottom)) {
            .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
            .safe-top { padding-top: env(safe-area-inset-top); }
        }
    </style>
    <!-- Tailwind CSS is built via PostCSS (no CDN). -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
